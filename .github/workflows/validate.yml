name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # THE ESTATE FLOOR, defined once in dbhq-uk/.github (dbhq-uk/.github#4):
  # SKILL.md frontmatter parses as YAML and names its directory, plugin.json
  # parses and carries no version, skill paths are braced, every shell script
  # passes bash -n and shellcheck, ruff E9,F, and no em or en dashes. The
  # strict frontmatter parse that started here, duplicate keys and the " #"
  # that cuts a description short included, is now the floor's. Pinned by
  # SHA; Dependabot moves the pin.
  floor:
    uses: dbhq-uk/.github/.github/workflows/skill-floor.yml@af131df509f44eb9abfe8b37ad6299c11f496c5f
    with:
      # The Python is held to the dash rule too, as it was before the floor.
      dash-files: "*.md *.py"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - run: python3 -m pip install --quiet pytest
      - run: python3 -m pytest skills/deskwork/tests -q
      - name: no real identifiers in examples
        run: |
          if grep -rInE '[A-Z]{3,}-[0-9]{3,}' --include='*.md' .; then
            echo "looks like a real ticket id"; exit 1
          fi
